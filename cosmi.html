<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heppy Borthday 💙</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Dancing+Script:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#02000a;--gold:#f5c842;--rose:#ff8fb0;
  --lavender:#c09cf0;--aurora:#74f0d8;
  --text:rgba(255,255,255,0.88);--text-dim:rgba(255,255,255,0.42);
  --cat-dark:#180a36;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);
  font-family:'Crimson Pro',serif;overflow:hidden;user-select:none;}

/* ── canvases ── */
#bgCanvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;
  transition:opacity 0.8s ease,filter 1.8s ease;}
#cakeCanvas{position:fixed;inset:0;z-index:5;width:100%;height:100%;
  pointer-events:none;transition:opacity 1.8s ease;}
#sparkCanvas{position:fixed;inset:0;z-index:55;pointer-events:none;width:100%;height:100%;}

/* ── phases ── */
.phase{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;padding-bottom:5vh;
  opacity:0;pointer-events:none;
  transform:translateY(14px) scale(0.985);
  transition:opacity 1.35s cubic-bezier(0.22,0.9,0.36,1),
             transform 1.35s cubic-bezier(0.22,0.9,0.36,1);}
.phase.active{opacity:1;transform:translateY(0) scale(1);pointer-events:all;}
/* letter phase keeps its own centering — no cake visible there */
#phase10{justify-content:center;padding-bottom:0;overflow-y:auto;padding:2rem 1.5rem;}

/* ── typewriter lines ── */
.tw-wrap{text-align:center;padding:1rem 2rem;max-width:700px;}
.tw-line{display:block;font-family:'Crimson Pro',serif;font-style:italic;font-weight:300;
  font-size:clamp(1rem,2.9vw,1.82rem);line-height:2.1;color:var(--text);
  min-height:2em;opacity:0;
  transform:translateY(10px);
  text-shadow:0 0 0px rgba(245,200,66,0);
  transition:opacity 0.75s cubic-bezier(0.22,0.9,0.36,1),
             transform 0.75s cubic-bezier(0.22,0.9,0.36,1),
             text-shadow 1.2s ease;}
.tw-line.on{opacity:1;transform:translateY(0);
  text-shadow:0 0 28px rgba(245,200,66,0.13),0 0 60px rgba(192,156,240,0.07);}

/* ── counter ── */
.counter-block{margin:1.8rem 0 0.5rem;text-align:center;opacity:0;
  transform:translateY(12px);transition:opacity 0.9s ease,transform 0.9s ease;}
.counter-block.show{opacity:1;transform:translateY(0);}
.counter-label{font-family:'Crimson Pro',serif;font-size:0.68rem;letter-spacing:0.5em;
  color:var(--text-dim);text-transform:uppercase;margin-bottom:0.6rem;}
.counter-value{font-family:'Dancing Script',cursive;font-size:clamp(1.8rem,5.5vw,3.6rem);
  color:var(--gold);letter-spacing:0.08em;
  text-shadow:0 0 40px rgba(245,200,66,0.45),0 0 80px rgba(245,200,66,0.15);
  transition:text-shadow 0.4s ease;}
.counter-value.flash{text-shadow:0 0 80px rgba(245,200,66,0.9),0 0 140px rgba(245,200,66,0.5);}
.counter-time{font-family:'Dancing Script',cursive;font-size:clamp(1rem,2.8vw,2rem);
  color:rgba(245,200,66,0.55);letter-spacing:0.22em;margin-top:0.45rem;
  text-shadow:0 0 20px rgba(245,200,66,0.25);min-height:1.6em;}

/* ── buttons ── */
.btn-soft{margin-top:2.8rem;padding:0.72rem 2.4rem;background:transparent;
  border:1px solid rgba(255,255,255,0.16);color:rgba(255,255,255,0.52);
  font-family:'Crimson Pro',serif;font-style:italic;font-size:1rem;
  letter-spacing:0.18em;cursor:pointer;border-radius:100px;opacity:0;
  transform:translateY(12px) scale(0.95);
  overflow:hidden;position:relative;
  transition:opacity 1s cubic-bezier(0.22,0.9,0.36,1),
             transform 1s cubic-bezier(0.22,0.9,0.36,1),
             border-color 0.35s,color 0.35s,background 0.35s,
             box-shadow 0.35s;}
.btn-soft::before{content:'';position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,0.08) 50%,transparent 70%);
  transform:translateX(-100%);transition:transform 0s;}
.btn-soft:hover::before{transform:translateX(100%);transition:transform 0.55s ease;}
.btn-soft.show{opacity:1;transform:translateY(0) scale(1);}
.btn-soft:hover{border-color:rgba(245,200,66,0.45);color:rgba(255,255,255,0.92);
  background:rgba(245,200,66,0.06);
  box-shadow:0 0 22px rgba(245,200,66,0.12),0 0 44px rgba(245,200,66,0.05);}

/* ── phase 2 ── */
#p2hint{position:absolute;top:11%;left:50%;transform:translateX(-50%);
  font-style:italic;font-size:clamp(0.82rem,2vw,1.05rem);color:var(--text-dim);
  letter-spacing:0.22em;opacity:0;transition:opacity 0.8s ease;
  pointer-events:none;white-space:nowrap;}
.p2-note{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);
  font-style:italic;font-size:0.85rem;color:rgba(255,255,255,0.28);
  letter-spacing:0.2em;opacity:0;transition:opacity 0.7s ease;
  pointer-events:none;white-space:nowrap;}
.p2-note.show{opacity:1;}

/* ── knife ── */
#knifeWrap{position:fixed;z-index:35;width:44px;height:120px;cursor:grab;
  touch-action:none;display:none;opacity:0;transition:opacity 0.6s ease;
  filter:drop-shadow(0 4px 14px rgba(245,200,66,0.22));}
#knifeWrap:active{cursor:grabbing;}
#knifeWrap.lit{filter:drop-shadow(0 6px 22px rgba(245,200,66,0.5));}
.t-flash{position:fixed;inset:0;z-index:200;background:rgba(255,255,255,0.18);
  pointer-events:none;animation:flashOut 0.35s ease forwards;}
@keyframes flashOut{to{opacity:0;}}

/* ── cat ── */
#catWrap{position:fixed;z-index:80;width:92px;height:115px;
  transition:left 1.3s cubic-bezier(0.34,1.08,0.64,1);pointer-events:none;}
#speechBubble{position:absolute;bottom:calc(100% + 6px);right:-22px;
  background:rgba(8,4,22,0.82);backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.13);border-radius:16px 16px 4px 16px;
  padding:0.6rem 1rem;font-family:'Crimson Pro',serif;font-size:0.88rem;
  line-height:1.55;color:rgba(255,255,255,0.88);max-width:215px;
  white-space:pre-line;text-align:center;opacity:0;
  transform:translateY(10px) scale(0.88);
  transition:opacity 0.42s cubic-bezier(0.34,1.56,0.64,1),
             transform 0.42s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 0 0.5px rgba(255,255,255,0.06);}
#speechBubble.on{opacity:1;transform:translateY(0) scale(1);}
@keyframes tailWag{0%,100%{transform:rotate(-18deg);}50%{transform:rotate(14deg) translateX(3px);}}
@keyframes catIdle{
  0%,100%{transform:translateY(0) scale(1,1);}
  30%{transform:translateY(-4px) scale(1.01,0.99);}
  60%{transform:translateY(-5px) scale(0.99,1.01);}
  80%{transform:translateY(-2px) scale(1,1);}}
@keyframes catTalk{0%,100%{transform:translateY(0) rotate(0);}33%{transform:translateY(-2px) rotate(-1.2deg);}66%{transform:translateY(-2px) rotate(1.2deg);}}
@keyframes catWalk{0%,100%{transform:translateY(0) rotate(0);}25%{transform:translateY(-4px) rotate(-1.5deg);}75%{transform:translateY(-4px) rotate(1.5deg);}}
#catSvg{display:block;}
#catSvg.idle{animation:catIdle 3.6s cubic-bezier(0.45,0.05,0.55,0.95) infinite;}
#catSvg.talking{animation:catTalk 0.48s ease-in-out infinite;}
#catSvg.walking{animation:catWalk 0.44s ease-in-out infinite;}
#cat-tail{transform-origin:58px 88px;animation:tailWag 2.4s cubic-bezier(0.45,0.05,0.55,0.95) infinite;}
.cat-e{display:none;}.cat-e.on{display:block;}

/* ── cosmos ── */
#cosmosScene{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;
  align-items:center;justify-content:center;opacity:0;pointer-events:none;
  transition:opacity 2.2s cubic-bezier(0.22,0.9,0.36,1);
  background:radial-gradient(ellipse at 50% 45%,rgba(18,4,52,0.82) 0%,rgba(4,1,18,0.92) 60%,rgba(2,0,10,0.98) 100%);}
#cosmosScene.active{opacity:1;pointer-events:all;}
#breathUI{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.5rem;transition:opacity 1s ease;}
#breathUI.gone{opacity:0;pointer-events:none;}
.breath-ring{width:140px;height:140px;border-radius:50%;
  border:1px solid rgba(100,240,216,0.3);
  box-shadow:0 0 38px rgba(100,240,216,0.09),inset 0 0 24px rgba(100,240,216,0.05);
  display:flex;align-items:center;justify-content:center;
  transition:transform 3.4s cubic-bezier(0.45,0.05,0.55,0.95),
    border-color 3.4s ease,box-shadow 3.4s ease;}
.breath-ring.expand{transform:scale(2.1);border-color:rgba(100,240,216,0.65);
  box-shadow:0 0 110px rgba(100,240,216,0.28),0 0 200px rgba(80,40,160,0.15),
             inset 0 0 50px rgba(100,240,216,0.14);}
@keyframes auroraScreenPulse{
  0%{box-shadow:inset 0 0 0 rgba(100,240,216,0);}
  50%{box-shadow:inset 0 0 180px rgba(100,240,216,0.04),inset 0 0 80px rgba(80,40,200,0.06);}
  100%{box-shadow:inset 0 0 0 rgba(100,240,216,0);}}
#cosmosScene.active{animation:auroraScreenPulse 7s ease-in-out infinite;}
.breath-dot{width:7px;height:7px;border-radius:50%;background:rgba(100,240,216,0.85);
  box-shadow:0 0 18px rgba(100,240,216,0.9),0 0 36px rgba(100,240,216,0.4);}
.breath-text{font-family:'Crimson Pro',serif;font-style:italic;
  font-size:clamp(0.75rem,1.8vw,0.95rem);letter-spacing:0.55em;
  color:rgba(255,255,255,0.38);text-align:center;min-height:1.5em;
  transition:opacity 0.6s ease;}
#revealUI{display:none;flex-direction:column;align-items:center;
  transition:opacity 0.9s ease;}
#revealUI.show{display:flex;}
#wishUI{display:none;flex-direction:column;align-items:center;gap:1.4rem;
  max-width:480px;text-align:center;transition:opacity 0.9s ease;}
#wishUI.show{display:flex;}
.wish-title{font-family:'Dancing Script',cursive;font-size:clamp(1.5rem,4.5vw,2.8rem);
  color:rgba(245,200,66,0.85);text-shadow:0 0 35px rgba(245,200,66,0.32);
  opacity:0;transform:translateY(8px);transition:opacity 1s ease,transform 1s ease;}
.wish-title.on{opacity:1;transform:translateY(0);}
#whisperLine{font-family:'Crimson Pro',serif;font-style:italic;
  font-size:clamp(0.85rem,2vw,1.08rem);color:rgba(255,255,255,0.44);
  letter-spacing:0.28em;min-height:1.8em;text-align:center;
  opacity:0;transition:opacity 0.42s ease;}
#whisperLine.on{opacity:1;}
#wishOrbWrap{margin-top:0.8rem;display:flex;align-items:center;justify-content:center;
  position:relative;opacity:0;transition:opacity 1.2s ease;}
.wish-orb{width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,200,66,0.09),rgba(192,156,240,0.06),transparent 70%);
  border:1px solid rgba(245,200,66,0.38);color:var(--gold);font-size:1.55rem;
  cursor:pointer;animation:wishPulse 2.4s ease-in-out infinite;
  position:relative;z-index:2;transition:transform 0.28s;}
.wish-orb:hover{transform:scale(1.1);}
@keyframes wishPulse{
  0%,100%{box-shadow:0 0 16px rgba(245,200,66,0.18);}
  50%{box-shadow:0 0 38px rgba(245,200,66,0.36),0 0 70px rgba(192,156,240,0.16);}}
.orb-ring{position:absolute;width:112px;height:112px;border-radius:50%;
  border:1px solid rgba(245,200,66,0.12);
  animation:orbRingPulse 2.4s ease-in-out infinite;}
@keyframes orbRingPulse{
  0%,100%{transform:scale(1);opacity:0.5;}
  50%{transform:scale(1.12);opacity:0.22;}}
#wishMadeBanner{position:fixed;z-index:300;top:26%;left:50%;
  transform:translateX(-50%) scale(0.86);font-family:'Dancing Script',cursive;
  font-size:clamp(2.2rem,7vw,5rem);color:var(--gold);
  text-shadow:0 0 55px rgba(245,200,66,0.6),0 0 100px rgba(245,200,66,0.25);
  white-space:nowrap;letter-spacing:0.06em;opacity:0;pointer-events:none;
  transition:opacity 0.7s ease,transform 0.7s ease;}
#wishMadeBanner.on{opacity:1;transform:translateX(-50%) scale(1);}

/* ── memory stars ── */
@keyframes starTwinkleIn{
  0%{opacity:0;transform:scale(0) rotate(-20deg);}
  60%{opacity:1;transform:scale(1.28) rotate(6deg);}
  80%{transform:scale(0.92) rotate(-3deg);}
  100%{opacity:1;transform:scale(1) rotate(0deg);}}
@keyframes svgStarSpin{
  from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes svgStarPulse{
  0%,100%{opacity:0.35;r:9;}
  50%{opacity:0.65;r:11;}}
@keyframes svgCorona{
  0%,100%{opacity:0.18;transform:scale(1);}
  50%{opacity:0.42;transform:scale(1.22);}}
@keyframes svgStarGlow{
  0%,100%{filter:drop-shadow(0 0 4px rgba(245,200,66,0.7)) drop-shadow(0 0 8px rgba(245,200,66,0.4));}
  50%{filter:drop-shadow(0 0 10px rgba(245,200,66,1)) drop-shadow(0 0 22px rgba(245,200,66,0.65)) drop-shadow(0 0 40px rgba(192,156,240,0.3));}}
@keyframes svgSpecialGlow{
  0%,100%{filter:drop-shadow(0 0 5px rgba(192,156,240,0.8)) drop-shadow(0 0 12px rgba(192,156,240,0.4));}
  50%{filter:drop-shadow(0 0 14px rgba(192,156,240,1)) drop-shadow(0 0 28px rgba(192,156,240,0.6)) drop-shadow(0 0 50px rgba(245,200,66,0.25));}}
.mem-star{position:fixed;z-index:88;width:44px;height:44px;display:flex;
  align-items:center;justify-content:center;opacity:0;
  cursor:pointer;
  transition:opacity 0.3s ease,transform 0.32s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events:none;}
.mem-star svg{display:block;transition:transform 0.32s cubic-bezier(0.34,1.56,0.64,1);}
.mem-star:hover svg{transform:scale(1.42);}
.mem-star.show{opacity:1;pointer-events:all;animation:starTwinkleIn 0.72s cubic-bezier(0.34,1.3,0.64,1) both;}
.mem-star.locked{pointer-events:none!important;opacity:0.38!important;}
.mem-star .star-svg{animation:svgStarGlow 2.8s ease-in-out infinite;}
.mem-star.special-star .star-svg{animation:svgSpecialGlow 2.6s ease-in-out infinite;}
.star-inner-spin{transform-origin:22px 22px;animation:svgStarSpin 14s linear infinite;}
.star-corona{transform-origin:22px 22px;animation:svgCorona 3s ease-in-out infinite;}

/* ── TYFE — bright glowing font ── */
@keyframes tyfePulse{
  0%,100%{text-shadow:0 0 14px rgba(245,200,66,1),0 0 32px rgba(245,200,66,0.85),0 0 65px rgba(245,200,66,0.55),0 0 120px rgba(245,200,66,0.28),0 0 200px rgba(192,156,240,0.18);}
  40%{text-shadow:0 0 22px rgba(245,200,66,1),0 0 55px rgba(245,200,66,0.95),0 0 100px rgba(245,200,66,0.7),0 0 180px rgba(245,200,66,0.38),0 0 280px rgba(192,156,240,0.28);}
  55%{text-shadow:0 0 16px rgba(245,200,66,1),0 0 38px rgba(245,200,66,0.88),0 0 72px rgba(245,200,66,0.6),0 0 130px rgba(245,200,66,0.3),0 0 210px rgba(192,156,240,0.2);}}
#tyfeWrap{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;
  opacity:0;transition:opacity 1.8s cubic-bezier(0.22,0.9,0.36,1);}
#tyfeWrap.on{opacity:1;}
#tyfeMain{font-family:'Dancing Script',cursive;
  font-size:clamp(2.2rem,7.5vw,5.4rem);color:#fff;font-weight:700;
  text-align:center;letter-spacing:0.06em;line-height:1.2;
  text-shadow:
    0 0 14px rgba(245,200,66,1),
    0 0 32px rgba(245,200,66,0.85),
    0 0 65px rgba(245,200,66,0.55),
    0 0 120px rgba(245,200,66,0.28),
    0 0 200px rgba(192,156,240,0.18);
  opacity:0;transform:scale(0.84) translateY(22px);
  transition:opacity 1.6s cubic-bezier(0.22,0.9,0.36,1),transform 1.6s cubic-bezier(0.22,0.9,0.36,1);}
#tyfeMain.on{opacity:1;transform:scale(1) translateY(0);animation:tyfePulse 2.8s ease-in-out infinite;}

/* ── photo frames ── */
.photo-frame{position:fixed;z-index:60;border-radius:50%;overflow:hidden;
  border:2px solid rgba(245,200,66,0.35);
  box-shadow:0 0 18px rgba(245,200,66,0.18);opacity:0;
  transition:opacity 1.2s ease,box-shadow 0.5s ease,transform 0.5s ease;
  pointer-events:none;}
.photo-frame img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-frame.glow{box-shadow:0 0 28px rgba(245,200,66,0.7),0 0 60px rgba(245,200,66,0.35);}

/* ── slice pieces ── */
.slice-piece{position:fixed;z-index:62;cursor:pointer;opacity:0;
  transition:opacity 0.9s ease,filter 0.3s ease;
  filter:drop-shadow(0 4px 18px rgba(245,200,66,0.3));pointer-events:none;}
.slice-piece.show{opacity:1;pointer-events:all;}
.slice-inner{width:80px;height:62px;position:relative;
  background:linear-gradient(180deg,#fff4f8 0%,#ffe8f0 55%,#e0c4a0 100%);
  border-radius:5px 5px 3px 3px;
  box-shadow:0 6px 22px rgba(40,10,80,0.5),inset 0 1px 0 rgba(255,255,255,0.55);}
.slice-frosting{position:absolute;top:0;left:0;right:0;height:14px;
  background:linear-gradient(180deg,#ffe0f0,#ffcce0);border-radius:5px 5px 0 0;}
.slice-label{margin-top:10px;font-family:'Crimson Pro',serif;font-style:italic;
  font-size:0.8rem;letter-spacing:0.18em;color:rgba(255,255,255,0.38);
  text-align:center;transition:color 0.3s ease;}

/* ── letter ── */
#letterWrap{max-width:580px;width:100%;text-align:center;padding:0 1rem;}
.letter-para{font-family:'Crimson Pro',serif;font-style:italic;font-weight:300;
  font-size:clamp(1rem,2.4vw,1.32rem);line-height:2.05;color:rgba(255,255,255,0.82);
  white-space:pre-line;margin-bottom:1.4rem;opacity:0;
  transform:translateY(18px);
  transition:opacity 1.4s cubic-bezier(0.22,0.9,0.36,1),transform 1.4s cubic-bezier(0.22,0.9,0.36,1);}
.letter-para.on{opacity:1;transform:translateY(0);}
.letter-sign{font-family:'Dancing Script',cursive;font-size:clamp(1.3rem,3.5vw,2rem);
  color:var(--gold);text-shadow:0 0 25px rgba(245,200,66,0.45);opacity:0;
  transform:translateY(12px) scale(0.9);
  transition:opacity 1.2s cubic-bezier(0.22,0.9,0.36,1),transform 1.2s cubic-bezier(0.22,0.9,0.36,1);
  display:block;margin-top:0.4rem;}
.letter-sign.on{opacity:1;transform:translateY(0) scale(1);}

/* ── birthday wish scene ── */
@keyframes wishBreathe{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.016);}}
#birthdayWishScene{position:fixed;inset:0;z-index:432;
  display:flex;align-items:center;justify-content:center;
  background:#02000a;opacity:0;pointer-events:none;
  transition:opacity 2.2s cubic-bezier(0.22,0.9,0.36,1);}
#birthdayWishScene.on{opacity:1;}
#birthdayWishText{font-family:'Dancing Script',cursive;
  font-size:clamp(1.9rem,5.5vw,4.4rem);color:var(--gold);
  text-align:center;max-width:820px;padding:2rem;
  text-shadow:
    0 0 20px rgba(245,200,66,0.95),
    0 0 50px rgba(245,200,66,0.6),
    0 0 100px rgba(245,200,66,0.3),
    0 0 160px rgba(192,156,240,0.2);
  letter-spacing:0.06em;opacity:0;transform:translateY(22px) scale(0.9);
  transition:opacity 1.8s cubic-bezier(0.22,0.9,0.36,1),transform 1.8s cubic-bezier(0.22,0.9,0.36,1);}
#birthdayWishText.on{opacity:1;transform:translateY(0) scale(1);animation:wishBreathe 5s ease-in-out infinite;}

/* ── ending ── */
#endingOverlay{position:fixed;inset:0;z-index:430;background:#02000a;opacity:0;
  pointer-events:none;transition:opacity 2.2s ease;}
#endingOverlay.on{opacity:1;pointer-events:all;}
#restartBtn{position:fixed;z-index:445;top:58%;left:50%;
  transform:translate(-50%,-50%) scale(0.88);font-family:'Crimson Pro',serif;
  font-style:italic;font-size:1rem;letter-spacing:0.3em;color:rgba(255,255,255,0.3);
  background:transparent;border:1px solid rgba(255,255,255,0.1);
  padding:0.7rem 2.4rem;border-radius:100px;cursor:pointer;opacity:0;
  pointer-events:none;
  transition:opacity 0.9s ease,transform 0.9s ease,border-color 0.3s,color 0.3s;}
#restartBtn.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:all;}
/* ── vignette (permanent depth layer) ── */
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(2,0,10,0.55) 75%,rgba(2,0,10,0.88) 100%);}

/* ══════════════════════════════════════
   UNIVERSAL FLOAT + HOVER GLOW SYSTEM
══════════════════════════════════════ */
@keyframes floatA{0%,100%{transform:translateY(0px);}50%{transform:translateY(-5px);}}
@keyframes floatB{0%,100%{transform:translateY(0px);}50%{transform:translateY(-7px);}}
@keyframes floatC{0%,100%{transform:translateY(-2px);}50%{transform:translateY(-9px);}}
@keyframes floatStar{
  0%,100%{transform:translateY(0px) scale(1) rotate(0deg);}
  30%{transform:translateY(-6px) scale(1.04) rotate(4deg);}
  70%{transform:translateY(-4px) scale(0.97) rotate(-3deg);}}

/* Typewriter lines — subtle float once visible */
.tw-line.on{animation:floatA 4.8s ease-in-out infinite;}
.tw-line.on:nth-child(2){animation-duration:5.3s;animation-delay:0.4s;}
.tw-line.on:nth-child(3){animation-duration:4.4s;animation-delay:0.8s;}
.tw-line.on:nth-child(4){animation-duration:5.6s;animation-delay:0.2s;}
.tw-line.on:nth-child(5){animation-duration:4.9s;animation-delay:0.6s;}
.tw-line.on:nth-child(6){animation-duration:5.1s;animation-delay:1s;}

/* Counter */
.counter-block.show{animation:floatB 5.2s ease-in-out infinite 0.5s;}
.counter-value{animation:floatA 4.6s ease-in-out infinite;}

/* Buttons float + hover glow */
.btn-soft.show{opacity:1;transform:translateY(0) scale(1);
  animation:floatA 4.4s ease-in-out infinite 0.6s;}
.btn-soft.show:hover{
  transform:translateY(-3px) scale(1.03)!important;
  animation:none;
  box-shadow:0 0 28px rgba(245,200,66,0.22),0 0 55px rgba(245,200,66,0.1),
             0 0 90px rgba(192,156,240,0.08);}

/* Wish title */
.wish-title.on{animation:floatB 5s ease-in-out infinite;}
.wish-title.on:hover{text-shadow:0 0 55px rgba(245,200,66,0.55),0 0 100px rgba(245,200,66,0.25);}

/* Wish orb hover glow */
.wish-orb:hover{transform:scale(1.14);
  box-shadow:0 0 50px rgba(245,200,66,0.5),0 0 100px rgba(245,200,66,0.22),
             0 0 150px rgba(192,156,240,0.15);}

/* Whisper line */
#whisperLine.on{animation:floatA 4.2s ease-in-out infinite;}

/* Letter paragraphs float + hover */
.letter-para.on{animation:floatA 5.5s ease-in-out infinite;}
.letter-para.on:nth-child(2){animation-duration:6s;animation-delay:0.3s;}
.letter-para.on:nth-child(3){animation-duration:5.2s;animation-delay:0.6s;}
.letter-para.on:nth-child(4){animation-duration:6.4s;animation-delay:0.9s;}
.letter-para.on:hover{
  color:rgba(255,255,255,0.96);
  text-shadow:0 0 40px rgba(192,156,240,0.18),0 0 80px rgba(245,200,66,0.08);}

/* Letter sign */
.letter-sign.on{animation:floatC 4s ease-in-out infinite 1s;}

/* Photo frames float */
.photo-frame{animation:floatB 5.8s ease-in-out infinite;}
.photo-frame:hover{
  box-shadow:0 0 32px rgba(245,200,66,0.55),0 0 65px rgba(245,200,66,0.25),
             0 0 110px rgba(192,156,240,0.15)!important;
  transform:scale(1.05);}

/* Slice pieces float + hover */
.slice-piece.show:not([data-opened]){animation:floatA 4.5s ease-in-out infinite;}
.slice-piece:hover .slice-inner{
  box-shadow:0 8px 32px rgba(40,10,80,0.6),0 0 30px rgba(245,200,66,0.22),
             inset 0 1px 0 rgba(255,255,255,0.7);}

/* Hint text */
#p2hint{animation:floatA 5s ease-in-out infinite;}
.p2-note.show{animation:floatA 4.8s ease-in-out infinite 0.4s;}

/* TYFE text — float too (heartbeat pulse already on it, stack carefully) */
#tyfeMain.on{animation:tyfePulse 2.8s ease-in-out infinite, floatB 5.5s ease-in-out infinite 0.5s;}

/* Memory stars — float constantly */
.mem-star.show{animation:starTwinkleIn 0.72s cubic-bezier(0.34,1.3,0.64,1) both,
               floatStar 4s ease-in-out infinite 0.8s;}
.mem-star.show:hover{animation:none;transform:scale(1.45) translateY(-4px);}

/* p2hint, counter labels hover glow */
.counter-label:hover{color:rgba(255,255,255,0.7);}
.counter-time{animation:floatA 4.6s ease-in-out infinite 0.3s;}
.counter-time:hover{text-shadow:0 0 30px rgba(245,200,66,0.55);}

/* WishMade banner hover */
#wishMadeBanner.on:hover{
  text-shadow:0 0 80px rgba(245,200,66,0.9),0 0 150px rgba(245,200,66,0.4);}

/* Restart button float */
#restartBtn.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:all;
  animation:floatA 4.5s ease-in-out infinite 0.5s;}
#restartBtn.on:hover{transform:translate(-50%,-50%) scale(1.05) translateY(-3px)!important;
  animation:none;
  border-color:rgba(245,200,66,0.55);color:rgba(255,255,255,0.9);
  box-shadow:0 0 28px rgba(245,200,66,0.2);}

/* Birthday wish text hover */
#birthdayWishText.on:hover{
  text-shadow:0 0 30px rgba(245,200,66,1),0 0 65px rgba(245,200,66,0.75),
              0 0 120px rgba(245,200,66,0.4),0 0 200px rgba(192,156,240,0.3);}

/* ── wish orb enhanced ── */
@keyframes wishPulse{
  0%,100%{box-shadow:0 0 18px rgba(245,200,66,0.2),0 0 0 0 rgba(245,200,66,0.12);}
  50%{box-shadow:0 0 44px rgba(245,200,66,0.42),0 0 70px rgba(192,156,240,0.2),0 0 0 8px rgba(245,200,66,0.04);}}

/* ══════════════════════════════════════════════════
   FINAL TOUCH ANIMATIONS
══════════════════════════════════════════════════ */

/* 1. Cursor ripple on click */
.click-ripple{position:fixed;z-index:999;pointer-events:none;border-radius:50%;
  border:1.5px solid rgba(245,200,66,0.55);
  transform:scale(0);opacity:1;
  animation:clickRipple 0.7s cubic-bezier(0.22,0.9,0.36,1) forwards;}
@keyframes clickRipple{
  0%{transform:scale(0);opacity:0.8;}
  100%{transform:scale(1);opacity:0;}}

/* 2. Ambient floating motes canvas */
#motesCanvas{position:fixed;inset:0;z-index:2;pointer-events:none;
  width:100%;height:100%;opacity:0.55;}

/* 3. Slice piece — bounce-in entrance */
@keyframes sliceBounceIn{
  0%{opacity:0;transform:translateY(-28px) scale(0.7);}
  65%{transform:translateY(4px) scale(1.06);}
  82%{transform:translateY(-3px) scale(0.97);}
  100%{opacity:1;transform:translateY(0) scale(1);}}
.slice-piece.show{opacity:1;pointer-events:all;
  animation:sliceBounceIn 0.65s cubic-bezier(0.34,1.3,0.64,1) both;}

/* 4. Photo frame entrance */
@keyframes photoPopIn{
  0%{opacity:0;transform:scale(0.6);}
  70%{transform:scale(1.08);}
  100%{opacity:1;transform:scale(1);}}
.photo-frame{position:fixed;z-index:60;border-radius:50%;overflow:hidden;
  border:2px solid rgba(245,200,66,0.35);
  box-shadow:0 0 18px rgba(245,200,66,0.18);opacity:0;
  transition:opacity 0.6s ease, box-shadow 0.5s ease;}
.photo-frame.show-anim{animation:photoPopIn 0.72s cubic-bezier(0.34,1.3,0.64,1) both;}
.photo-frame.glow{box-shadow:0 0 28px rgba(245,200,66,0.7),0 0 60px rgba(245,200,66,0.35);}

/* 5. Letter sign spinning ✦ */
@keyframes signFloat{
  0%,100%{transform:translateY(0) scale(1) rotate(0deg);}
  30%{transform:translateY(-5px) scale(1.05) rotate(8deg);}
  65%{transform:translateY(-3px) scale(1.02) rotate(-4deg);}}
.letter-sign.on{opacity:1;transform:translateY(0) scale(1);
  animation:signFloat 5s cubic-bezier(0.45,0.05,0.55,0.95) infinite 1.2s;}

/* 6. WishMadeBanner secondary pulse after appear */
@keyframes bannerPulse{
  0%,100%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(1.04);}}
#wishMadeBanner.on{opacity:1;transform:translateX(-50%) scale(1);
  animation:bannerPulse 2s ease-in-out infinite 0.7s;}

/* 7. Wish orb ring slow continuous spin */
.orb-ring{position:absolute;width:112px;height:112px;border-radius:50%;
  border:1px solid rgba(245,200,66,0.12);
  animation:orbRingPulse 2.4s ease-in-out infinite, orbSpin 12s linear infinite;}
@keyframes orbSpin{from{transform:rotate(0deg) scale(1);}to{transform:rotate(360deg) scale(1);}}

/* 8. Knife wiggle when grabbed */
@keyframes knifeWiggle{
  0%,100%{transform:rotate(0deg);}
  20%{transform:rotate(-4deg);}
  40%{transform:rotate(3deg);}
  60%{transform:rotate(-2deg);}
  80%{transform:rotate(1deg);}}
#knifeWrap.lit{filter:drop-shadow(0 6px 22px rgba(245,200,66,0.5));
  animation:knifeWiggle 0.38s ease-in-out;}

/* 9. Screen-edge shimmer wave on phase change */
@keyframes phaseRipple{
  0%{opacity:0.18;transform:scale(0.88);}
  60%{opacity:0.06;}
  100%{opacity:0;transform:scale(1.05);}}
.phase-ripple{position:fixed;inset:0;z-index:19;pointer-events:none;
  background:radial-gradient(ellipse at 50% 60%,rgba(192,156,240,0.14) 0%,transparent 70%);
  animation:phaseRipple 1.1s cubic-bezier(0.22,0.9,0.36,1) forwards;}

/* 10. Cat ground shadow pulse */
@keyframes shadowPulse{
  0%,100%{rx:21;opacity:0.22;}
  50%{rx:24;opacity:0.14;}}
#cat-shadow{animation:shadowPulse 3.6s ease-in-out infinite;}

/* 11. Counter time tick flash */
@keyframes timeTick{
  0%{opacity:0.55;transform:scale(1);}
  10%{opacity:0.88;transform:scale(1.04);}
  100%{opacity:0.55;transform:scale(1);}}
.counter-time.tick{animation:timeTick 0.22s ease-out;}

/* 12. Falling star glint */
@keyframes starGlint{
  0%,100%{filter:drop-shadow(0 0 10px rgba(245,200,66,0.7)) brightness(1);}
  50%{filter:drop-shadow(0 0 20px rgba(245,200,66,1)) brightness(1.25);}}

/* 13. Star game ring full — spinning arc */
@keyframes ringFullSpin{from{stroke-dashoffset:0;}to{stroke-dashoffset:-477.52;}}

/* 14. Page load fade-in */
@keyframes bodyReveal{
  from{opacity:0;}to{opacity:1;}}
body{animation:bodyReveal 1.4s ease-out forwards;}

/* 15. Scroll cue on letter */
#scrollCue{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);
  font-size:1.1rem;opacity:0;pointer-events:none;
  animation:scrollCuePulse 2s ease-in-out infinite;color:rgba(255,255,255,0.22);}
@keyframes scrollCuePulse{
  0%,100%{opacity:0;transform:translateX(-50%) translateY(0);}
  50%{opacity:0.45;transform:translateX(-50%) translateY(4px);}}
</style>
</head>

<script>
'use strict';
const W=()=>window.innerWidth, H=()=>window.innerHeight;
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const easeOut3=t=>1-Math.pow(1-t,3);

/* ════════════════════════════════════════════════════════════════
   AUDIO
════════════════════════════════════════════════════════════════ */
function playAudio(src,vol=1){
  try{const a=new Audio(src);a.volume=vol;a.play().catch(()=>{});return a;}
  catch(e){return null;}
}

/* ════════════════════════════════════════════════════════════════
   CANVASES
════════════════════════════════════════════════════════════════ */
const bgCv=$('bgCanvas'),    bgCtx=bgCv.getContext('2d');
const cakeCv=$('cakeCanvas'),cakeCtx=cakeCv.getContext('2d');
const sparkCv=$('sparkCanvas'),sparkCtx=sparkCv.getContext('2d');
const motesCv=$('motesCanvas'),motesCtx=motesCv.getContext('2d');

function resize(){
  bgCv.width=W();   bgCv.height=H();
  cakeCv.width=W(); cakeCv.height=H();
  sparkCv.width=W();sparkCv.height=H();
  motesCv.width=W();motesCv.height=H();
  motesCv.width=W();motesCv.height=H();
}
resize();
window.addEventListener('resize',resize);

/* ════════════════════════════════════════════════════════════════
   STAR BACKGROUND
════════════════════════════════════════════════════════════════ */
const SCOLS=['#ffffff','#ffe8f0','#e0d0ff','#c8f2ff','#ffe0a0','#f0ffee'];
const STARS=Array.from({length:200},()=>({
  x:Math.random()*W(), y:Math.random()*H(),
  r:Math.random()*1.5+0.15, a:Math.random(),
  da:(Math.random()*0.009+0.002)*(Math.random()>.5?1:-1),
  c:SCOLS[Math.floor(Math.random()*SCOLS.length)]
}));
const SHOOTERS=[];
let cosmosMode=false;

setInterval(()=>{
  if(Math.random()>(cosmosMode?.85:.45))return;
  SHOOTERS.push({x:Math.random()*W()*.82,y:Math.random()*H()*(cosmosMode?.55:.35),
    vx:(Math.random()*7+4)*(Math.random()>.35?1:-1),vy:Math.random()*2.5+.6,
    life:1,dec:cosmosMode?.014:.02,w:cosmosMode?2.2:1.6});
},3200);
setInterval(()=>{
  if(!cosmosMode)return;
  for(let i=0;i<2;i++)SHOOTERS.push({
    x:Math.random()*W(),y:Math.random()*H()*.5,
    vx:(Math.random()*9+5)*(Math.random()>.3?1:-1),vy:Math.random()*3+.8,
    life:1,dec:.012,w:2});
},800);

(function bgLoop(){
  bgCtx.clearRect(0,0,bgCv.width,bgCv.height);
  /* nebula gradient — shifts to deep indigo in cosmos mode */
  const nx=W()*.62, ny=H()*.22;
  const ng=bgCtx.createRadialGradient(nx,ny,0,nx,ny,W()*(cosmosMode?.7:.4));
  if(cosmosMode){
    ng.addColorStop(0,'rgba(40,8,120,0.12)');
    ng.addColorStop(0.5,'rgba(20,4,80,0.07)');
    ng.addColorStop(1,'transparent');
  } else {
    ng.addColorStop(0,'rgba(80,30,160,0.04)');ng.addColorStop(1,'transparent');
  }
  bgCtx.fillStyle=ng;bgCtx.fillRect(0,0,bgCv.width,bgCv.height);
  STARS.forEach(s=>{
    /* cosmos: slow flutter + brightness boost */
    const daScale=cosmosMode?0.3:1;
    s.a+=s.da*daScale;
    if(s.a>1){s.a=1;s.da*=-1;}if(s.a<.06){s.a=.06;s.da*=-1;}
    const alpha=cosmosMode?Math.min(1,s.a*1.45):s.a;
    const radius=cosmosMode?s.r*1.35:s.r;
    bgCtx.beginPath();bgCtx.arc(s.x,s.y,radius,0,Math.PI*2);
    bgCtx.fillStyle=s.c;bgCtx.globalAlpha=alpha;bgCtx.fill();
  });
  for(let i=SHOOTERS.length-1;i>=0;i--){
    const s=SHOOTERS[i];s.x+=s.vx;s.y+=s.vy;s.life-=s.dec;
    if(s.life<=0){SHOOTERS.splice(i,1);continue;}
    /* longer trails in cosmos mode */
    const trailLen=cosmosMode?11:7;
    const g=bgCtx.createLinearGradient(s.x,s.y,s.x-s.vx*trailLen,s.y-s.vy*trailLen);
    g.addColorStop(0,`rgba(255,255,255,${s.life})`);g.addColorStop(1,'rgba(255,255,255,0)');
    bgCtx.beginPath();bgCtx.moveTo(s.x,s.y);bgCtx.lineTo(s.x-s.vx*trailLen,s.y-s.vy*trailLen);
    bgCtx.strokeStyle=g;bgCtx.lineWidth=s.w||1.6;bgCtx.globalAlpha=s.life;bgCtx.stroke();
  }
  bgCtx.globalAlpha=1;requestAnimationFrame(bgLoop);
})();

/* ════════════════════════════════════════════════════════════════
   AMBIENT MOTES  (gentle always-present floating specks)
════════════════════════════════════════════════════════════════ */
const MOTE_COLS=['rgba(245,200,66,','rgba(192,156,240,','rgba(116,240,216,','rgba(255,255,255,'];
const MOTES=Array.from({length:38},()=>({
  x:Math.random()*W(), y:Math.random()*H(),
  r:Math.random()*1.8+0.3,
  vx:(Math.random()-.5)*0.18, vy:-(Math.random()*0.22+0.06),
  a:Math.random()*0.45+0.08,
  da:(Math.random()*0.003+0.001)*(Math.random()>.5?1:-1),
  col:MOTE_COLS[Math.floor(Math.random()*MOTE_COLS.length)]
}));
(function motesLoop(){
  motesCtx.clearRect(0,0,motesCv.width,motesCv.height);
  MOTES.forEach(m=>{
    m.x+=m.vx; m.y+=m.vy;
    m.a+=m.da;
    if(m.a>0.55){m.a=0.55;m.da*=-1;}
    if(m.a<0.04){m.a=0.04;m.da*=-1;}
    if(m.y<-10){m.y=H()+10;m.x=Math.random()*W();}
    if(m.x<-10)m.x=W()+10;
    if(m.x>W()+10)m.x=-10;
    const rg=motesCtx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r*2.8);
    rg.addColorStop(0,m.col+m.a+')');
    rg.addColorStop(1,m.col+'0)');
    motesCtx.beginPath();motesCtx.arc(m.x,m.y,m.r*2.8,0,Math.PI*2);
    motesCtx.fillStyle=rg;motesCtx.fill();
    motesCtx.beginPath();motesCtx.arc(m.x,m.y,m.r,0,Math.PI*2);
    motesCtx.fillStyle=m.col+(m.a*1.6)+')';motesCtx.fill();
  });
  requestAnimationFrame(motesLoop);
})();

/* ════════════════════════════════════════════════════════════════
   CAKE DRAW
════════════════════════════════════════════════════════════════ */
let candleBlown=false, cakeVisible=false, cakeOpacity=0, flameT=0;
const BOT_DRIPS=[{ox:.08,h:17},{ox:.20,h:11},{ox:.33,h:19},{ox:.46,h:9},{ox:.59,h:15},{ox:.72,h:13},{ox:.84,h:18},{ox:.93,h:10}];
const TOP_DRIPS=[{ox:.10,h:13},{ox:.26,h:9},{ox:.44,h:16},{ox:.62,h:8},{ox:.80,h:14},{ox:.92,h:11}];
const SPRINKLES=[{rx:-22,ry:20,sz:5.5,col:'#ffd080'},{rx:20,ry:28,sz:4.5,col:'#ff98c0'},{rx:-4,ry:40,sz:3.5,col:'#c0a0ff'},{rx:30,ry:16,sz:4,col:'#80e8f8'},{rx:-32,ry:34,sz:5,col:'#ff98c0'},{rx:8,ry:48,sz:3,col:'#a0ff98'}];

function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function drawStar5(ctx,x,y,r,col){
  ctx.save();ctx.translate(x,y);ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<5;i++){const a1=(i*4*Math.PI)/5-Math.PI/2,a2=a1+(2*Math.PI)/10;
    ctx.lineTo(Math.cos(a1)*r,Math.sin(a1)*r);ctx.lineTo(Math.cos(a2)*r*.42,Math.sin(a2)*r*.42);}
  ctx.closePath();ctx.fill();ctx.restore();
}
function drawDrips(ctx,cx,topY,w,drips,col){
  ctx.fillStyle=col;
  drips.forEach(d=>{const x=cx-w/2+d.ox*w;
    ctx.beginPath();ctx.arc(x,topY,5,Math.PI,0);

    ctx.bezierCurveTo(x-4.5,topY+d.h,x-5,topY+d.h*.55,x-5,topY);
    ctx.closePath();ctx.fill();});
}
function drawFlame(ctx,fx,fy){
  flameT+=0.11;
  const flick=Math.sin(flameT*3.8)*2+Math.sin(flameT*5.2)*1.4;
  const fh=15+flick, fw=6+Math.sin(flameT*4.5)*1.5;
  const glowG=ctx.createRadialGradient(fx,fy-6,0,fx,fy-6,28);
  glowG.addColorStop(0,'rgba(255,200,50,0.28)');glowG.addColorStop(.5,'rgba(255,120,20,0.1)');glowG.addColorStop(1,'transparent');
  ctx.fillStyle=glowG;ctx.beginPath();ctx.ellipse(fx,fy-6,24,24,0,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.beginPath();ctx.moveTo(fx,fy);
  ctx.bezierCurveTo(fx-fw,fy-fh*.4,fx-fw*.8+flick*.5,fy-fh,fx,fy-fh-2);
  ctx.bezierCurveTo(fx+fw*.8+flick*.3,fy-fh,fx+fw,fy-fh*.4,fx,fy);
  const fg=ctx.createLinearGradient(fx,fy,fx,fy-fh-2);
  fg.addColorStop(0,'rgba(255,110,15,0.95)');fg.addColorStop(.4,'rgba(255,188,38,0.9)');
  fg.addColorStop(.8,'rgba(255,238,96,0.82)');fg.addColorStop(1,'rgba(255,255,200,0.5)');
  ctx.fillStyle=fg;ctx.fill();ctx.restore();
  ctx.save();ctx.beginPath();ctx.moveTo(fx,fy-2);
  ctx.bezierCurveTo(fx-fw*.4,fy-fh*.55,fx-fw*.3,fy-fh*.88,fx,fy-fh*.9);
  ctx.bezierCurveTo(fx+fw*.3,fy-fh*.88,fx+fw*.4,fy-fh*.55,fx,fy-2);
  const if2=ctx.createLinearGradient(fx,fy-2,fx,fy-fh);
  if2.addColorStop(0,'rgba(255,200,50,0.9)');if2.addColorStop(1,'rgba(255,255,220,0.65)');
  ctx.fillStyle=if2;ctx.fill();ctx.restore();
}
function drawCake(ctx,cx,cy){
  ctx.save();
  /* ── ambient bloom beneath cake ── */
  const bloom=ctx.createRadialGradient(cx,cy+80,0,cx,cy+80,200);
  bloom.addColorStop(0,'rgba(245,200,66,0.08)');
  bloom.addColorStop(0.5,'rgba(192,156,240,0.04)');
  bloom.addColorStop(1,'transparent');
  ctx.fillStyle=bloom;ctx.fillRect(cx-220,cy-80,440,340);

  /* ── candle flame warm light cast on cake ── */
  if(!candleBlown){

    flameGlow.addColorStop(0,`rgba(255,200,60,${0.13+Math.sin(flameT*3.1)*0.04})`);
    flameGlow.addColorStop(0.5,'rgba(255,140,20,0.04)');
    flameGlow.addColorStop(1,'transparent');
    ctx.fillStyle=flameGlow;ctx.fillRect(cx-110,cy-80,220,200);
  }

  ctx.shadowColor='rgba(40,10,80,0.55)';ctx.shadowBlur=28;ctx.shadowOffsetX=7;ctx.shadowOffsetY=10;
  const bw=162,bh=74,bx=cx-bw/2,by=cy+36;
  rrect(ctx,bx,by,bw,bh,9);
  const bg1=ctx.createLinearGradient(bx,by,bx+bw,by+bh);
  bg1.addColorStop(0,'#fff6ea');bg1.addColorStop(.35,'#fff0e0');bg1.addColorStop(1,'#e0c4a0');
  ctx.fillStyle=bg1;ctx.fill();
  ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#4a2060';
  rrect(ctx,bx+bw-10,by+5,10,bh-5,3);ctx.fill();ctx.restore();
  ctx.beginPath();ctx.ellipse(cx,by,bw/2+4,12,0,0,Math.PI*2);ctx.fillStyle='#f8f0ff';ctx.fill();
  drawDrips(ctx,cx,by,bw,BOT_DRIPS,'#f0e8ff');
  for(let i=0;i<8;i++){const dx=bx+14+i*19;
    ctx.beginPath();ctx.arc(dx,by+26,3.5,0,Math.PI*2);ctx.fillStyle=i%2===0?'#f8b0d0':'#c8b0f8';ctx.fill();
    ctx.beginPath();ctx.arc(dx,by+54,3.5,0,Math.PI*2);ctx.fillStyle=i%2===0?'#c8b0f8':'#f8b0d0';ctx.fill();}
  const tw=102,th=56,tx=cx-tw/2,ty=cy-20;
  ctx.shadowColor='rgba(40,10,80,0.4)';ctx.shadowBlur=20;ctx.shadowOffsetX=5;ctx.shadowOffsetY=8;
  rrect(ctx,tx,ty,tw,th,8);
  const tg1=ctx.createLinearGradient(tx,ty,tx+tw,ty+th);
  tg1.addColorStop(0,'#fff4f8');tg1.addColorStop(.35,'#ffe8f0');tg1.addColorStop(1,'#e0b8c8');
  ctx.fillStyle=tg1;ctx.fill();
  ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  ctx.save();ctx.globalAlpha=.15;ctx.fillStyle='#4a2060';
  rrect(ctx,tx+tw-8,ty+4,8,th-4,3);ctx.fill();ctx.restore();
  ctx.beginPath();ctx.ellipse(cx,ty,tw/2+3,10,0,0,Math.PI*2);ctx.fillStyle='#fff4ff';ctx.fill();
  drawDrips(ctx,cx,ty,tw,TOP_DRIPS,'#ffe8f8');

  /* ── shimmer highlight drifting across frosting ── */
  const shimX=tx + ((Date.now()*0.00018)%1)*tw;
  const shimG=ctx.createLinearGradient(shimX-18,ty,shimX+18,ty);
  shimG.addColorStop(0,'rgba(255,255,255,0)');shimG.addColorStop(0.5,'rgba(255,255,255,0.22)');shimG.addColorStop(1,'rgba(255,255,255,0)');
  ctx.save();ctx.beginPath();ctx.rect(tx,ty,tw,18);ctx.clip();
  ctx.fillStyle=shimG;ctx.fillRect(shimX-22,ty,44,18);ctx.restore();

  SPRINKLES.forEach(s=>drawStar5(ctx,cx+s.rx,ty+s.ry,s.sz,s.col));
  const cndX=cx, cndY=ty-32;
  if(!candleBlown){
    ctx.shadowColor='rgba(255,220,80,0.35)';ctx.shadowBlur=12;
    const cg=ctx.createLinearGradient(cndX-5,0,cndX+5,0);
    cg.addColorStop(0,'#ffe060');cg.addColorStop(.5,'#fff6c0');cg.addColorStop(1,'#e8c030');
    rrect(ctx,cndX-5,cndY,10,30,3);ctx.fillStyle=cg;ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#fff6c0';ctx.beginPath();ctx.ellipse(cndX+3,cndY+9,3,5,.35,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.strokeStyle='#2a1010';ctx.lineWidth=1.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(cndX,cndY);ctx.lineTo(cndX+1,cndY-6);ctx.stroke();ctx.restore();
    drawFlame(ctx,cndX+1,cndY-6);
  } else {
    ctx.shadowColor='rgba(255,220,80,0.12)';ctx.shadowBlur=6;
    const cg=ctx.createLinearGradient(cndX-5,0,cndX+5,0);
    cg.addColorStop(0,'#d8b840');cg.addColorStop(.5,'#e8d890');cg.addColorStop(1,'#c8a020');
    rrect(ctx,cndX-5,cndY,10,30,3);ctx.fillStyle=cg;ctx.fill();ctx.shadowBlur=0;
    ctx.save();ctx.strokeStyle='#1a0808';ctx.lineWidth=1.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(cndX,cndY);ctx.lineTo(cndX+1,cndY-5);ctx.stroke();ctx.restore();
    ctx.save();
    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(cndX+(i-1)*3,cndY-6);
      ctx.bezierCurveTo(cndX+(i-1)*3-2,cndY-12,cndX+(i-1)*3+2,cndY-18,cndX+(i-1)*3,cndY-22);
      ctx.strokeStyle=`rgba(200,200,200,${0.08-i*0.02})`;ctx.lineWidth=1.2;ctx.stroke();}
    ctx.restore();
  }
  ctx.restore();
}

/* ── star→cake formation ── */
const FCOLS=['#f5c842','#ffe8a0','#c084fc','#ff85a1','#64ffda','#ffffff'];
let formParticles=[],formDone=false,formFadeIn=false;

function buildFormTargets(cx,cy){
  const pts=[];
  const bw=162,bh=74,bx=cx-81,by=cy+36;
  for(let i=0;i<=44;i++){const t=i/44;pts.push({x:bx+t*bw,y:by});pts.push({x:bx+t*bw,y:by+bh});}
  for(let i=0;i<=22;i++){const t=i/22;pts.push({x:bx,y:by+t*bh});pts.push({x:bx+bw,y:by+t*bh});}
  const tw=102,th=56,tx=cx-51,ty=cy-20;
  for(let i=0;i<=28;i++){const t=i/28;pts.push({x:tx+t*tw,y:ty});pts.push({x:tx+t*tw,y:ty+th});}
  for(let i=0;i<=16;i++){const t=i/16;pts.push({x:tx,y:ty+t*th});pts.push({x:tx+tw,y:ty+t*th});}
  for(let i=0;i<10;i++)pts.push({x:cx+(-5+Math.random()*10),y:ty-10-Math.random()*36});
  return pts;
}
function startFormation(){
  return new Promise(resolve=>{
    const cx=W()/2, cy=H()*0.33;
    const targets=buildFormTargets(cx,cy);
    formParticles=targets.slice(0,Math.min(targets.length,130)).map(t=>({
      x:Math.random()*W(),y:Math.random()*H(),tx:t.x,ty:t.y,
      r:Math.random()*2.2+0.7,col:FCOLS[Math.floor(Math.random()*FCOLS.length)],
      prog:0,spd:.011+Math.random()*.016}));
    formDone=false;cakeOpacity=0;formFadeIn=false;
    (function loop(){
      cakeCtx.clearRect(0,0,cakeCv.width,cakeCv.height);
      if(!formDone){
        let all=true;
        formParticles.forEach(p=>{
          p.prog=Math.min(1,p.prog+p.spd);if(p.prog<1)all=false;
          const e=easeOut3(p.prog),px=p.x+(p.tx-p.x)*e,py=p.y+(p.ty-p.y)*e;
          cakeCtx.beginPath();cakeCtx.arc(px,py,p.r,0,Math.PI*2);
          cakeCtx.fillStyle=p.col;cakeCtx.globalAlpha=1-p.prog*.55;cakeCtx.fill();});
        cakeCtx.globalAlpha=1;
        if(all&&!formFadeIn){formFadeIn=true;setTimeout(()=>{formDone=true;},180);}
      } else cakeOpacity=Math.min(1,cakeOpacity+.025);
      if(cakeOpacity>0){cakeCtx.globalAlpha=cakeOpacity;drawCake(cakeCtx,W()/2,H()*0.33);cakeCtx.globalAlpha=1;}
      if(cakeOpacity<1)requestAnimationFrame(loop);
      else{cakeVisible=true;startCakeLoop();resolve();}
    })();
  });
}
function startCakeLoop(){
  (function loop(){
    cakeCtx.clearRect(0,0,cakeCv.width,cakeCv.height);
    drawCake(cakeCtx,W()/2,H()*0.33);
    if(cakeVisible)requestAnimationFrame(loop);
  })();
}

async function rollCounterToReal(){

  const el=$('counterVal');
  const steps=tY-2010, stepMs=Math.round(1800/steps);
  for(let y=2010;y<=tY;y++){
    const mm=String(tM).padStart(2,'0'), dd=String(tD).padStart(2,'0');
    el.textContent=`${y} · ${mm} · ${dd}`;
    if(y===tY){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),700);}
    if(y<tY)await wait(stepMs);
  }
  /* live seconds tick */
  function tick(){
    const d=new Date();
    const el=$('counterTime');
    if(!el)return;
    el.textContent=
      `${String(d.getHours()).padStart(2,'0')} : ${String(d.getMinutes()).padStart(2,'0')} : ${String(d.getSeconds()).padStart(2,'0')}`;
    el.classList.remove('tick');
    void el.offsetWidth; /* reflow to restart animation */
    el.classList.add('tick');

  tick();liveTickInterval=setInterval(tick,1000);

let sgCaught = 0, sgSpawnTimer = null, sgActive = false, sgFalling = [];
const SG_EMOJIS = ['⭐','🌟','✦','✧','💫'];
const SG_CAT_LINES = [
  [2, 'ohhh nice catch !!!','excited'],
  [4, 'Yesss keep goinggg 🌙','excited'],

];

function _sgSpawnLoop(){
  if(!sgActive) return;
  _sgSpawnStar();
  const delay = 700 + Math.random() * 800;
  sgSpawnTimer = setTimeout(_sgSpawnLoop, delay);
}

function _sgSpawnStar(){
  if(!sgActive) return;
  const el = document.createElement('div');
  const emoji = SG_EMOJIS[Math.floor(Math.random() * SG_EMOJIS.length)];
  const sz = 28 + Math.random() * 22;          /* 28–50 px */
  const x  = 60 + Math.random() * (W() - 120);
  const spd = 1.4 + Math.random() * 1.8;       /* px / frame */
  const drift = (Math.random() - 0.5) * 0.4;   /* gentle horizontal float */

  el.textContent = emoji;
  el.style.cssText = `
    position:fixed; z-index:46; font-size:${sz}px; line-height:1;
    left:${x}px; top:-${sz + 20}px;
    opacity:0; pointer-events:all; cursor:pointer;
    transition:opacity 0.35s ease;
    filter:drop-shadow(0 0 10px rgba(245,200,66,0.7)) drop-shadow(0 ${sz*0.6}px ${sz*0.5}px rgba(245,200,66,0.18));
    user-select:none;`;

  el.addEventListener('click', () => _sgCatchStar(el));
  el.addEventListener('touchstart', e => { e.preventDefault(); _sgCatchStar(el); }, {passive:false});
  document.body.appendChild(el);
  sgFalling.push({el, y: -(sz+20), spd, drift, x, sz});

  /* fade in */
  requestAnimationFrame(() => el.style.opacity = '1');

  /* animate fall */
  (function fall(){
    const idx = sgFalling.findIndex(s => s.el === el);
    if(idx === -1) return;                       /* already caught */
    const s = sgFalling[idx];
    s.y  += s.spd;
    s.x  += s.drift;
    el.style.top  = s.y + 'px';
    el.style.left = s.x + 'px';
    if(s.y > H() + s.sz + 40){
      /* missed — remove quietly */
      el.remove();
      sgFalling.splice(idx, 1);
      return;
    }
    if(sgActive) requestAnimationFrame(fall);
  })();
}

function _sgCatchStar(el){
  if(!sgActive) return;
  const idx = sgFalling.findIndex(s => s.el === el);
  if(idx === -1) return;
  const {x, y, sz} = sgFalling[idx];

  /* remove from tracking + DOM */
  sgFalling.splice(idx, 1);
  el.style.pointerEvents = 'none';
  el.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
  el.style.opacity = '0';
  el.style.transform = 'scale(1.8)';
  setTimeout(() => el.remove(), 220);

  /* burst on sparkCanvas */
  _sgBurst(x + sz/2, y + sz/2);

  sgCaught++;
  _sgUpdateRing();

  /* bounce the count number */
  const cnt = $('sgCount');
  cnt.style.transform = 'scale(1.35)';
  setTimeout(() => cnt.style.transform = 'scale(1)', 220);

  /* cat reactions */
  const line = SG_CAT_LINES.find(l => l[0] === sgCaught);
  if(line) catSay(line[1], line[2], 1800);

  if(sgCaught >= SG_TOTAL) _sgWin();
}

function _sgUpdateRing(){
  const arc = $('sgRingArc');
  const cnt = $('sgCount');
  const circ = 477.52;
  const fill = (sgCaught / SG_TOTAL);
  arc.style.strokeDashoffset = circ * (1 - fill);
  /* colour shift: gold → aurora as it fills */
  if(fill >= 1){
    arc.style.stroke = '#74f0d8';
    arc.style.filter = 'drop-shadow(0 0 14px rgba(116,240,216,0.9))';
  } else if(fill >= 0.6){
    arc.style.stroke = '#c09cf0';
    arc.style.filter = 'drop-shadow(0 0 10px rgba(192,156,240,0.7))';
  }
  cnt.textContent = sgCaught;
  /* full ring spin when complete */
  if(fill >= 1){
    const arcEl = $('sgRingArc');
    arcEl.style.animation = 'ringFullSpin 3s linear infinite';
    arcEl.style.transformOrigin = '90px 90px';
    arcEl.style.transformBox = 'fill-box';
  }
}

function _sgBurst(cx, cy){
  const COLS = ['#f5c842','#ffe0a0','#c084fc','#ff8fb0','#74f0d8','#ffffff'];
  const ps = Array.from({length:26}, () => ({
    x:cx, y:cy,
    vx:(Math.random()-.5)*13, vy:(Math.random()-.5)*13,
    r:Math.random()*3.5+1.5,
    col:COLS[Math.floor(Math.random()*COLS.length)],
    life:1, dec:.032+Math.random()*.018
  }));
  /* ring ripple */
  const ripple = {cx, cy, r:0, maxR:55, life:1};
  (function loop(){
    let alive = false;
    ps.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.vy+=.07; p.life-=p.dec;
      if(p.life<=0) return; alive=true;
      /* core dot */
      sparkCtx.beginPath(); sparkCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
      sparkCtx.fillStyle=p.col; sparkCtx.globalAlpha=p.life; sparkCtx.fill();
      /* glow halo */
      const rg=sparkCtx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.8);
      rg.addColorStop(0,`rgba(245,200,66,${p.life*0.22})`); rg.addColorStop(1,'transparent');
      sparkCtx.beginPath(); sparkCtx.arc(p.x,p.y,p.r*2.8,0,Math.PI*2);
      sparkCtx.fillStyle=rg; sparkCtx.globalAlpha=1; sparkCtx.fill();
    });
    /* expand ring ripple */
    if(ripple.r < ripple.maxR){
      ripple.r += 3.2; ripple.life = 1 - ripple.r/ripple.maxR;
      sparkCtx.beginPath(); sparkCtx.arc(ripple.cx,ripple.cy,ripple.r,0,Math.PI*2);
      sparkCtx.strokeStyle=`rgba(245,200,66,${ripple.life*0.7})`;
      sparkCtx.lineWidth=2; sparkCtx.globalAlpha=1; sparkCtx.stroke();
      alive=true;
    }
    sparkCtx.globalAlpha=1;
    if(alive) requestAnimationFrame(loop);
  })();
}

function _sgPartyBurst(){
  const COLS=['#f5c842','#ffe0a0','#c084fc','#ff8fb0','#74f0d8','#ffffff','#aaffaa','#ffaaee','#ff6b6b','#6bffdb'];

  /* ── circles ── */
  const circles = Array.from({length:120}, () => ({
    x: Math.random()*W(), y: Math.random()*H(),
    vx:(Math.random()-.5)*20, vy:(Math.random()-.5)*20,
    r: Math.random()*5+2,
    col: COLS[Math.floor(Math.random()*COLS.length)],
    life:1, dec:.007+Math.random()*.006, shape:'circle'
  }));

  /* ── confetti rectangles ── */
  const rects = Array.from({length:90}, () => ({
    x: Math.random()*W(), y: Math.random()*H(),
    vx:(Math.random()-.5)*22, vy:(Math.random()-.5)*22,
    w: 4+Math.random()*10, h: 2+Math.random()*5,
    rot: Math.random()*Math.PI*2,
    rotV:(Math.random()-.5)*0.25,
    col: COLS[Math.floor(Math.random()*COLS.length)],
    life:1, dec:.007+Math.random()*.007, shape:'rect'
  }));

  /* ── center explosion wave ── */
  const center = Array.from({length:80}, () => ({
    x:W()/2, y:H()/2,
    vx:(Math.random()-.5)*28, vy:(Math.random()-.5)*28,
    r:Math.random()*4+1.5,
    col:COLS[Math.floor(Math.random()*COLS.length)],
    life:1, dec:.009+Math.random()*.007, shape:'circle', delay: Math.floor(Math.random()*8)
  }));

  const all=[...circles,...rects,...center];

  (function loop(){
    let alive=false;
    all.forEach(p=>{
      if(p.delay>0){p.delay--;alive=true;return;}
      p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.vx*=0.992; p.life-=p.dec;
      if(p.life<=0) return; alive=true;

      if(p.shape==='rect'){
        p.rot+=p.rotV;
        sparkCtx.save();
        sparkCtx.translate(p.x,p.y); sparkCtx.rotate(p.rot);
        sparkCtx.fillStyle=p.col; sparkCtx.globalAlpha=p.life;
        sparkCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        sparkCtx.restore();
      } else {
        sparkCtx.beginPath(); sparkCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
        sparkCtx.fillStyle=p.col; sparkCtx.globalAlpha=p.life; sparkCtx.fill();
        const rg=sparkCtx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.6);
        rg.addColorStop(0,`rgba(245,200,66,${p.life*0.16})`); rg.addColorStop(1,'transparent');
        sparkCtx.beginPath(); sparkCtx.arc(p.x,p.y,p.r*2.6,0,Math.PI*2);
        sparkCtx.fillStyle=rg; sparkCtx.globalAlpha=1; sparkCtx.fill();
      }
    });
    sparkCtx.globalAlpha=1;
    if(alive) requestAnimationFrame(loop);
    else sparkCtx.clearRect(0,0,sparkCv.width,sparkCv.height);
  })();
}

let tyfePLoop=false;
async function revealTyfe(){
  const wrap=$('tyfeWrap'), main=$('tyfeMain');
  wrap.classList.add('on');await wait(200);main.classList.add('on');
  tyfePLoop=true;_tyfeTwinkle();
  await wait(4800);
  tyfePLoop=false;main.classList.remove('on');await wait(600);
  wrap.classList.remove('on');sparkCtx.clearRect(0,0,sparkCv.width,sparkCv.height);
}
function _tyfeTwinkle(){
  sparkCv.width=W();sparkCv.height=H();
  const cx=W()/2, cy=H()*.40;
  const textW=Math.min(W()*.82,680), textH=130;
  const TCOLS=['#f5c842','#ffe8a0','#ffffff','#c084fc','#ff8fb0','#74f0d8'];
  const particles=Array.from({length:110},()=>_mkTyfeP(cx,cy,textW,textH,TCOLS));
  (function loop(){
    if(!tyfePLoop)return;
    sparkCtx.clearRect(0,0,sparkCv.width,sparkCv.height);
    const t=Date.now()*0.001;
    particles.forEach((p,i)=>{
      const orbit=p.orbitR*(0.5+Math.sin(t*p.orbitSpd+p.orbitPh)*0.5);
      const ox=Math.cos(t*p.orbitSpd*0.7+p.orbitPh)*orbit;
      const oy=Math.sin(t*p.orbitSpd+p.orbitPh)*orbit*0.45;
      p.x+=p.vx;p.y+=p.vy;p.life-=p.dec;
      if(p.life<=0){particles[i]=_mkTyfeP(cx,cy,textW,textH,TCOLS);return;}
      const px=p.x+ox, py=p.y+oy;
      const pulse=0.55+Math.sin(t*p.pf*1000+p.po)*0.45;
      sparkCtx.beginPath();sparkCtx.arc(px,py,p.r*pulse,0,Math.PI*2);
      sparkCtx.fillStyle=p.col;sparkCtx.globalAlpha=p.life*0.88;sparkCtx.fill();
      const rg=sparkCtx.createRadialGradient(px,py,0,px,py,p.r*3.5);
      rg.addColorStop(0,`rgba(245,200,66,${p.life*0.16})`);rg.addColorStop(1,'transparent');
      sparkCtx.beginPath();sparkCtx.arc(px,py,p.r*3.5,0,Math.PI*2);
      sparkCtx.fillStyle=rg;sparkCtx.globalAlpha=1;sparkCtx.fill();
    });
    sparkCtx.globalAlpha=1;requestAnimationFrame(loop);
  })();
}
function _mkTyfeP(cx,cy,tw,th,COLS){
  return{x:cx+(Math.random()-.5)*tw*1.18,y:cy+(Math.random()-.5)*th*1.6,
    vx:(Math.random()-.5)*0.42,vy:-(Math.random()*0.42+0.08),
    r:Math.random()*2.6+0.5,col:COLS[Math.floor(Math.random()*COLS.length)],
    life:0.55+Math.random()*0.45,dec:0.003+Math.random()*0.003,
    pf:0.002+Math.random()*0.003,po:Math.random()*Math.PI*2,
    orbitR:3+Math.random()*8,orbitSpd:0.4+Math.random()*0.9,
    orbitPh:Math.random()*Math.PI*2};
}

async function checkSlicesDone(){

async function showBirthdayWishScene(){
  const scene=$('birthdayWishScene'),txt=$('birthdayWishText');
  scene.classList.add('on');await wait(400);
  /* faint starfield bloom on text appear */
  _wishBloom();
  txt.classList.add('on');
  const aud=playAudio('src/audio/wish.mp3',1);
  await new Promise(resolve=>{
    if(!aud){setTimeout(resolve,6500);return;}
    aud.addEventListener('ended',()=>setTimeout(resolve,3000));
    aud.addEventListener('error',()=>setTimeout(resolve,6500));
    setTimeout(resolve,16000);
  });
  txt.classList.remove('on');await wait(1200);scene.classList.remove('on');await wait(1800);
}
function _wishBloom(){
  const COLS=['#f5c842','#ffe8a0','#ffffff','#c09cf0','#74f0d8'];
  const ps=Array.from({length:55},()=>({
    x:Math.random()*W(),y:Math.random()*H(),
    vx:(Math.random()-.5)*0.6,vy:(Math.random()-.5)*0.6,
    r:Math.random()*2.2+0.4,
    col:COLS[Math.floor(Math.random()*COLS.length)],
    life:0.6+Math.random()*0.4,dec:0.005+Math.random()*0.004
  }));
  (function loop(){
    let alive=false;
    ps.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.life-=p.dec;
      if(p.life<=0)return;alive=true;
      sparkCtx.beginPath();sparkCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
      sparkCtx.fillStyle=p.col;sparkCtx.globalAlpha=p.life*0.75;sparkCtx.fill();
    });
    sparkCtx.globalAlpha=1;
    if(alive)requestAnimationFrame(loop);
  })();
}
